<script>
    /* =========================================================
       MENU
       ========================================================= */

    const menuButton =
        document.getElementById("menuButton");

    const menu =
        document.getElementById("menu");


    menuButton.addEventListener(
        "click",
        () => {

            const isOpen =
                menu.classList.toggle("active");

            menuButton.setAttribute(
                "aria-expanded",
                String(isOpen)
            );

            menuButton.setAttribute(
                "aria-label",
                isOpen
                    ? "Fechar menu"
                    : "Abrir menu"
            );

            menuButton.textContent =
                isOpen
                    ? "✕"
                    : "☰";
        }
    );


    menu.querySelectorAll("a").forEach(
        link => {

            link.addEventListener(
                "click",
                () => {

                    menu.classList.remove(
                        "active"
                    );

                    menuButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    menuButton.setAttribute(
                        "aria-label",
                        "Abrir menu"
                    );

                    menuButton.textContent =
                        "☰";
                }
            );
        }
    );


    /* =========================================================
       ACCORDION
       ========================================================= */

    document
        .querySelectorAll(".accordion-toggle")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const content =
                            button.nextElementSibling;

                        const isOpen =
                            button.classList.toggle(
                                "active"
                            );

                        button.setAttribute(
                            "aria-expanded",
                            String(isOpen)
                        );

                        content.classList.toggle(
                            "active",
                            isOpen
                        );
                    }
                );
            }
        );


    /* =========================================================
       DARK ENGINE
       ========================================================= */

    const darkZones =
        document.querySelectorAll(
            ".dark-engine-zone"
        );


    darkZones.forEach(
        zone => {

            let activePointerId =
                null;

            let mobileReveals =
                [];


            const moveLight =
                event => {

                    const rect =
                        zone.getBoundingClientRect();

                    const x =
                        event.clientX -
                        rect.left;

                    const y =
                        event.clientY -
                        rect.top;


                    zone.style.setProperty(
                        "--dark-x",
                        `${x}px`
                    );

                    zone.style.setProperty(
                        "--dark-y",
                        `${y}px`
                    );
                };


            const addMobileReveal =
                event => {

                    const rect =
                        zone.getBoundingClientRect();

                    const x =
                        Math.max(
                            0,
                            Math.min(
                                rect.width,
                                event.clientX -
                                rect.left
                            )
                        );

                    const y =
                        Math.max(
                            0,
                            Math.min(
                                rect.height,
                                event.clientY -
                                rect.top
                            )
                        );


                    mobileReveals.push({
                        x,
                        y
                    });


                    if (
                        mobileReveals.length >
                        40
                    ) {
                        mobileReveals.shift();
                    }


                    const gradients =
                        mobileReveals.map(
                            point =>
                                `radial-gradient(
                                    circle 115px at
                                    ${point.x}px
                                    ${point.y}px,
                                    transparent 0%,
                                    transparent 30%,
                                    rgba(0,0,0,.10) 40%,
                                    rgba(0,0,0,.34) 54%,
                                    rgba(0,0,0,.72) 72%,
                                    rgba(0,0,0,.96) 100%
                                )`
                        );


                    zone.style.setProperty(
                        "--mobile-reveals",
                        gradients.join(",")
                    );


                    zone.classList.add(
                        "dark-engine-mobile-active"
                    );
                };


            zone.addEventListener(
                "pointerenter",
                event => {

                    if (
                        event.pointerType ===
                        "mouse"
                    ) {

                        moveLight(event);

                        zone.classList.add(
                            "dark-engine-active"
                        );
                    }
                }
            );


            zone.addEventListener(
                "pointermove",
                event => {

                    if (
                        event.pointerType ===
                        "mouse"
                    ) {

                        moveLight(event);

                        zone.classList.add(
                            "dark-engine-active"
                        );

                        return;
                    }


                    if (
                        event.pointerId ===
                        activePointerId
                    ) {

                        addMobileReveal(
                            event
                        );
                    }
                }
            );


            zone.addEventListener(
                "pointerleave",
                event => {

                    if (
                        event.pointerType ===
                        "mouse"
                    ) {

                        zone.classList.remove(
                            "dark-engine-active"
                        );
                    }
                }
            );


            zone.addEventListener(
                "pointerdown",
                event => {

                    if (
                        event.pointerType !==
                        "mouse"
                    ) {

                        activePointerId =
                            event.pointerId;

                        zone.setPointerCapture(
                            event.pointerId
                        );

                        addMobileReveal(
                            event
                        );
                    }
                }
            );


            zone.addEventListener(
                "pointerup",
                event => {

                    if (
                        event.pointerType !==
                        "mouse" &&
                        event.pointerId ===
                        activePointerId
                    ) {

                        activePointerId =
                            null;

                        if (
                            zone.hasPointerCapture(
                                event.pointerId
                            )
                        ) {

                            zone.releasePointerCapture(
                                event.pointerId
                            );
                        }
                    }
                }
            );


            zone.addEventListener(
                "pointercancel",
                event => {

                    if (
                        event.pointerType !==
                        "mouse" &&
                        event.pointerId ===
                        activePointerId
                    ) {

                        activePointerId =
                            null;
                    }
                }
            );
        }
    );


    /* =========================================================
       SISTEMA DE DEGRADAÇÃO
       ========================================================= */

    const wait =
        ms =>
            new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        ms
                    )
            );


    const glitchText =
        async (
            element,
            newText,
            duration = 900
        ) => {

            if (!element) {
                return;
            }


            element.dataset.text =
                newText;

            element.classList.add(
                "glitching"
            );


            await wait(
                duration
            );


            element.textContent =
                newText;

            element.classList.remove(
                "glitching"
            );
        };


    const restoreText =
        async (
            element,
            originalText
        ) => {

            if (!element) {
                return;
            }


            element.classList.add(
                "inevitable-restabilizing"
            );


            await wait(
                700
            );


            element.textContent =
                originalText;

            element.dataset.text =
                originalText;


            element.classList.remove(
                "inevitable-restabilizing"
            );
        };


    /* =========================================================
       HERO
       A MORTE É APENAS O COMEÇO
       ========================================================= */

    const deathTagline =
        document.getElementById(
            "deathTagline"
        );


    const deathCycle =
        async () => {

            await wait(
                7000
            );


            await glitchText(
                deathTagline,
                "A VIDA É APENAS MAIS UM FIM",
                1000
            );


            await wait(
                4500
            );


            await glitchText(
                deathTagline,
                "OQUE VOCÊ ESCOLHE?",
                1400
            );


            await wait(
                3500
            );


            await glitchText(
                deathTagline,
                "A MORTE É APENAS O COMEÇO",
                1100
            );


            await wait(
                6000
            );


            deathCycle();
        };


    deathCycle();


    /* =========================================================
       ERROR + CONFETE
       ========================================================= */

    const createErrorBurst =
        (
            container,
            amount = 12
        ) => {

            if (!container) {
                return;
            }


            let errorContainer =
                container.querySelector(
                    ".inevitable-error-container"
                );


            if (!errorContainer) {

                errorContainer =
                    document.createElement(
                        "div"
                    );

                errorContainer.className =
                    "inevitable-error-container";

                container.style.position =
                    "relative";

                container.appendChild(
                    errorContainer
                );
            }


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                const error =
                    document.createElement(
                        "span"
                    );


                error.className =
                    "inevitable-error";


                error.textContent =
                    "ERROR";


                error.style.left =
                    `${Math.random() * 90}%`;


                error.style.top =
                    `${Math.random() * 90}%`;


                error.style.setProperty(
                    "--rotation",
                    `${Math.random() * 40 - 20}deg`
                );


                errorContainer.appendChild(
                    error
                );


                setTimeout(
                    () => {
                        error.remove();
                    },
                    900
                );
            }


            for (
                let i = 0;
                i <
                Math.min(
                    amount * 2,
                    40
                );
                i++
            ) {

                const piece =
                    document.createElement(
                        "span"
                    );


                piece.className =
                    "inevitable-confetti";


                piece.style.left =
                    "50%";


                piece.style.top =
                    "50%";


                piece.style.setProperty(
                    "--x",
                    `${Math.random() * 400 - 200}px`
                );


                piece.style.setProperty(
                    "--y",
                    `${Math.random() * 300 - 150}px`
                );


                piece.style.setProperty(
                    "--rotation",
                    `${Math.random() * 720 - 360}deg`
                );


                errorContainer.appendChild(
                    piece
                );


                setTimeout(
                    () => {
                        piece.remove();
                    },
                    900
                );
            }
        };


    /* =========================================================
       MANIFESTO
       MORRA. MUDE. DESCUBRA.
       ========================================================= */

    const manifestoText =
        document.getElementById(
            "manifestoText"
        );


    const manifestoContainer =
        manifestoText.closest(
            "section"
        );


    let manifestoState =
        0;


    let manifestoBusy =
        false;


    manifestoText.addEventListener(
        "click",
        async () => {

            if (manifestoBusy) {
                return;
            }


            manifestoBusy =
                true;


            if (
                manifestoState ===
                0
            ) {

                manifestoState =
                    1;


                await glitchText(
                    manifestoText,
                    "MORTE. MUDANÇA. DESCOBERTA",
                    800
                );


                manifestoBusy =
                    false;

                return;
            }


            if (
                manifestoState ===
                1
            ) {

                manifestoState =
                    2;


                await glitchText(
                    manifestoText,
                    "ERROR",
                    600
                );


                createErrorBurst(
                    manifestoContainer,
                    20
                );


                manifestoBusy =
                    false;

                return;
            }


            if (
                manifestoState ===
                2
            ) {

                manifestoState =
                    3;


                await glitchText(
                    manifestoText,
                    "VOCÊ NÃO DEVIA ESTAR AQUI",
                    1000
                );


                manifestoBusy =
                    false;

                return;
            }


            if (
                manifestoState ===
                3
            ) {

                manifestoState =
                    0;


                await restoreText(
                    manifestoText,
                    "MORRA. MUDE. DESCUBRA."
                );


                manifestoBusy =
                    false;
            }
        }
    );


    /* =========================================================
       SOBREVIVER É APRENDER
       ========================================================= */

    const survivalText =
        document.getElementById(
            "survivalText"
        );


    const survivalContainer =
        survivalText.closest(
            "section"
        );


    let survivalState =
        0;


    let survivalBusy =
        false;


    let survivalClicks =
        0;


    const survivalCycle =
        async () => {

            await wait(
                9000
            );


            if (
                survivalBusy ||
                survivalClicks >= 7
            ) {

                survivalCycle();

                return;
            }


            survivalBusy =
                true;


            await glitchText(
                survivalText,
                "sobreviver é morrer",
                900
            );


            await wait(
                4000
            );


            if (
                survivalClicks < 7
            ) {

                await glitchText(
                    survivalText,
                    "morrer é aprender",
                    900
                );
            }


            survivalBusy =
                false;


            await wait(
                5000
            );


            if (
                survivalClicks < 7
            ) {

                await glitchText(
                    survivalText,
                    "Sobreviver é aprender.",
                    900
                );
            }


            survivalCycle();
        };


    survivalCycle();


    survivalText.addEventListener(
        "click",
        async () => {

            if (survivalBusy) {
                return;
            }


            survivalClicks++;


            if (
                survivalText.textContent.trim() ===
                "morrer é aprender"
            ) {

                createErrorBurst(
                    survivalContainer,
                    24
                );
            }


            if (
                survivalClicks >= 7
            ) {

                survivalBusy =
                    true;


                await restoreText(
                    survivalText,
                    "Sobreviver é aprender."
                );


                survivalState =
                    0;


                survivalClicks =
                    0;


                survivalBusy =
                    false;
            }
        }
    );


    /* =========================================================
       PESQUISA
       ========================================================= */

    const surveyTitle =
        document.getElementById(
            "surveyTitle"
        );


    let surveyTitleChanged =
        false;


    surveyTitle.addEventListener(
        "click",
        async () => {

            if (
                surveyTitleChanged
            ) {

                return;
            }


            surveyTitleChanged =
                true;


            await glitchText(
                surveyTitle,
                "Avaliar é inevitável.",
                700
            );


            await wait(
                3500
            );


            await restoreText(
                surveyTitle,
                "Avalie Inevitável."
            );


            surveyTitleChanged =
                false;
        }
    );


    /* =========================================================
       FORMULÁRIO DA PESQUISA
       ========================================================= */

    const surveyForm =
        document.getElementById(
            "surveyForm"
        );


    const surveyFeedback =
        document.getElementById(
            "surveyFeedback"
        );


    surveyForm.addEventListener(
        "submit",
        event => {

            event.preventDefault();


            const rating =
                surveyForm.querySelector(
                    'input[name="rating"]:checked'
                );


            const permission =
                surveyForm.querySelector(
                    'input[name="permission"]:checked'
                );


            const comment =
                document
                    .getElementById(
                        "surveyComment"
                    )
                    .value
                    .trim();


            if (
                !rating ||
                !permission
            ) {

                return;
            }


            surveyFeedback.textContent =
                "Obrigado por avaliar Inevitável. Sua resposta foi registrada nesta página.";


            surveyFeedback.classList.add(
                "visible"
            );


            surveyForm.reset();


            console.log({
                rating:
                    Number(
                        rating.value
                    ),

                comment,

                permission:
                    permission.value
            });
        }
    );

</script>
